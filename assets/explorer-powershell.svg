<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="t d">
<title id="t">탐색기 주소창에 powershell 입력 → 그 폴더에서 PowerShell 열림 → claude 실행</title>
<desc id="d">탐색기에서 프로젝트 폴더를 연 뒤 주소창에 powershell을 입력하고 Enter를 누르면 그 폴더 경로가 잡힌 PowerShell 창이 열린다. 이어서 claude를 입력하고 Enter를 누르면 Claude Code 시작 화면이 뜬다.</desc>
<style>
